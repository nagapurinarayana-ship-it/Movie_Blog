ceChildren(article);const schema=document.createElement('script');schema.type='application/ld+json';schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Person','@id':`${canonical}#person`,'url':canonical,'name':director.name,'jobTitle':'Director','description':director.bio||undefined});document.head.appendChild(schema);}document.addEventListener('DOMContentLoaded',render);})();
