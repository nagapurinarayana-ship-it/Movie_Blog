<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actor — MovieBlog</title><meta name="description" content="Actor profile, biography and filmography on MovieBlog."><link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/actor"><meta property="og:type" content="profile"><meta property="og:title" content="Actor — MovieBlog"><meta property="og:description" content="Actor profile, biography and filmography on MovieBlog."><meta property="og:url" content="https://movie-blog-bdt.pages.dev/pages/actor"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="../style.css"></head>
<body><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../pages/search">Search</a></div></header><main class="container section"><div id="entityRoot" aria-live="polite">Loading actor…</div></main><footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer>
<script src="../assets/js/data-provider.js" defer></script><script src="../assets/js/entities.js" defer></script><script>
(()=>{const root=document.getElementById('entityRoot');const id=new URLSearchParams(location.search).get('id');const $=(t,v,c)=>{const n=document.createElement(t);n.textContent=v||'';if(c)n.className=c;return n;};async function render(){if(!id){root.replaceChildren($('p','Missing actor id.','muted'));return;}try{let actor;if(/^\d+$/.test(id)){actor=await window.MovieBlogDataProvider.person(id);}else{const entities=await window.MovieBlogEntities.loadEntities();const local=window.MovieBlogEntities.findEntity(entities.actors,id);if(!local){root.replaceChildren($('h1','Actor not found'),$('p','Search for this actor to open a live profile.','muted'));return;}const matches=await Promise.allSettled([window.MovieBlogDataProvider.personSearch(local.name)]);const found=matches[0].status==='fulfilled'?(matches[0].value||[]).find(p=>String(p.name).toLowerCase()===local.name.toLowerCase()):null;if(found)actor=await window.MovieBlogDataProvider.person(found.id);else actor={id:local.id,name:local.name,biography:local.bio||'',profile:''};}
const canonical=new URL(`./actor?id=${encodeURIComponent(actor.id)}`,location.href).href;const desc=(actor.biography||`Learn about ${actor.name}, biography and filmography on MovieBlog.`).replace(/\s+/g,' ').slice(0,155);document.title=`${actor.name} — MovieBlog`;document.querySelector('meta[name="description"]').content=desc;document.querySelector('link[rel="canonical"]').href=canonical;document.querySelector('meta[property="og:title"]').content=`${actor.name} — MovieBlog`;document.querySelector('meta[property="og:description"]').content=desc;document.querySelector('meta[property="og:url"]').content=canonical;
const article=document.createElement('article');article.className='card detail-card entity-card';const visual=document.createElement('div');visual.className='detail-visual entity-visual';if(actor.profile){const img=$('img','', 'poster');img.src=actor.profile;img.alt=`${actor.name} portrait`;img.loading='eager';visual.appendChild(img);}else visual.appendChild($('div',actor.name,'entity-placeholder'));const body=document.createElement('div');body.className='card-body';body.append($('p','ACTOR','eyebrow'),$('h1',actor.name),$('p',desc,'overview'));if(actor.knownFor?.length){const s=document.createElement('section');s.className='detail-section';s.appendChild($('h2','Filmography'));const grid=document.createElement('div');grid.className='entity-film-grid';actor.knownFor.filter(m=>m.id).slice(0,18).forEach(m=>{const a=document.createElement('a');a.className='entity-film';a.href=`../pages/movie?id=${encodeURIComponent(m.id)}`;if(m.poster){const img=$('img','','entity-film-poster');img.src=m.poster;img.alt=`${m.title} poster`;a.appendChild(img);}a.appendChild($('span',m.title));grid.appendChild(a);});s.appendChild(grid);body.appendChild(s);}const back=$('a','← Back to search','secondary-btn');back.href='../pages/search';body.appendChild(back);article.append(visual,body);root.replaceChildren(article);const schema=document.createElement('script');schema.type='application/ld+json';schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Person','@id':`${canonical}#person`,url:canonical,name:actor.name,description:actor.biography||undefined,image:actor.profile||undefined});document.head.appendChild(schema);}catch(e){console.error(e);root.replaceChildren($('h1','Actor unavailable'),$('p','This profile could not be loaded right now.','muted'));}}document.addEventListener('DOMContentLoaded',render);})();
</script></body></html>
