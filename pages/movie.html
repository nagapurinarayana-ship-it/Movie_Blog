<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Details — MovieBlog</title><meta name="description" content="Movie details, cast, crew, release information, box office and streaming availability on MovieBlog."><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/movie"><meta property="og:type" content="video.movie"><meta property="og:site_name" content="MovieBlog"><meta property="og:title" content="Movie Details — MovieBlog"><meta property="og:description" content="Movie details, cast, crew, release information, box office and streaming availability on MovieBlog."><meta property="og:url" content="https://movie-blog-bdt.pages.dev/pages/movie"><meta property="og:image" content="https://movie-blog-bdt.pages.dev/assets/placeholder.png"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/css/ui.css"><link rel="stylesheet" href="../assets/css/light-only.css"></head><body><header class="nav"><div class="container nav-inner"><a href="../" class="logo" aria-label="MovieBlog home">🎬 MovieBlog</a><a class="icon-btn" href="../pages/search">Search</a></div></header><main class="container section"><nav aria-label="Breadcrumb" class="meta" id="breadcrumbs"><a href="../">Home</a> › <a href="../pages/search">Movies</a> › <span>Details</span></nav><div id="movieDetails" aria-live="polite"><h1>Movie Details</h1><p class="hero-copy">Explore movie release information, cast, crew, box office, streaming availability and related titles.</p></div></main><footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer><script src="../assets/js/global-header.js" defer></script><script>
(()=>{const root=document.getElementById('movieDetails'),id=new URLSearchParams(location.search).get('id');const IMAGE='https://image.tmdb.org/t/p/w780';const PLACE='../assets/placeholder.png';const esc=v=>String(v||'').replace(/\s+/g,' ').trim();const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};const sec=t=>{const s=make('section');s.className='detail-section';s.append(make('h2',t));return s};const a=(text,href,cls='entity-link')=>{const e=document.createElement('a');e.textContent=text;e.href=href;e.className=cls;return e};async function get(url,fb){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error();return await r.json()}catch(_){return fb}}function slug(v){return esc(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function setMeta(m){const canonical=new URL(`./movie?id=${encodeURIComponent(id)}`,location.href).href;const d=esc(m.overview||`Find ${m.title} movie details, cast, release date, box office and OTT information on MovieBlog.`).slice(0,158);document.title=`${m.title} — MovieBlog`;document.querySelector('meta[name="description"]').content=d;document.querySelector('link[rel="canonical"]').href=canonical;document.querySelector('meta[property="og:url"]').content=canonical;document.querySelector('meta[property="og:title"]').content=`${m.title} — MovieBlog`;document.querySelector('meta[property="og:description"]').content=d;document.querySelector('meta[property="og:image"]').content=m.poster_path?IMAGE+m.poster_path:new URL(PLACE,location.href).href;document.getElementById('breadcrumbs').replaceChildren(a('Home','../'),make('span',' › '),a('Movies','../pages/search'),make('span',' › '),make('span',m.title))}function schema(m,dir,cast,genres){const url=new URL(`./movie?id=${encodeURIComponent(id)}`,location.href).href;const s={'@context':'https://schema.org','@type':'Movie','@id':url+'#movie',url,name:m.title,description:m.overview||undefined,image:m.poster_path?IMAGE+m.poster_path:undefined,dateCreated:m.release_date||undefined,genre:genres,director:dir?{'@type':'Person',name:dir.name}:undefined,actor:cast.slice(0,12).map(p=>({'@type':'Person',name:p.name||p}))};const b={'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem',position:1,name:'Home',item:new URL('../',location.href).href},{'@type':'ListItem',position:2,name:'Movies',item:new URL('../pages/search',location.href).href},{'@type':'ListItem',position:3,name:m.title,item:url}]};[s,b].forEach(x=>{const e=document.createElement('script');e.type='application/ld+json';e.textContent=JSON.stringify(x);document.head.append(e)})}function providerSection(m){const providers=m['watch/providers']?.results?.IN?.flatrate||[];const s=sec('Where to watch in India');const link=m['watch/providers']?.results?.IN?.link;if(!providers.length){s.append(make('p','Streaming availability is not currently confirmed by our provider data.','muted'));return s}const list=make('div');list.className='entity-list-inline';providers.slice(0,6).forEach(p=>{const name=p.provider_name||'Streaming service';const href=link||'#';const el=a(name,href,'entity-link');if(href!=='#'){el.target='_blank';el.rel='noopener noreferrer'}list.append(el)});s.append(make('p','Currently listed as available via these India streaming providers:','meta'),list);return s}async function render(m){const local=await get('../data/movies.json',[]);const bo=await get('../data/box-office.json',{movies:{}});const ott=await get('../data/ott.json',{movies:{}});setMeta(m);const genres=(m.genres||[]).map(g=>g.name||g).filter(Boolean),cast=m.credits?.cast||m.cast||[],dir=(m.credits?.crew||[]).find(x=>x.job==='Director')||null;const article=make('article');article.className='card detail-card';const pw=make('div');pw.className='poster-wrap';const img=document.createElement('img');img.className='poster';img.loading='eager';img.alt=`${m.title} poster`;img.src=m.poster_path?IMAGE+m.poster_path:PLACE;img.onerror=()=>img.src=PLACE;pw.append(img);const body=make('div');body.className='card-body';body.append(make('p','MOVIE','eyebrow'),make('h1',m.title));const meta=[];if(m.release_date)meta.push(String(m.release_date).slice(0,10));if(m.runtime)meta.push(`${Math.floor(m.runtime/60)}h ${m.runtime%60}m`);if(m.vote_average)meta.push(`⭐ ${Number(m.vote_average).toFixed(1)}`);body.append(make('p',meta.join(' • '),'meta'));if(genres.length)body.append(make('p',genres.join(' • '),'meta'));body.append(make('p',m.overview||'Movie information is being updated.','overview'));const c=sec('Cast & Crew');if(dir){const p=make('p');p.append('Director: ',a(dir.name,`./director?id=${encodeURIComponent(slug(dir.name))}`));c.append(p)}if(cast.length){const list=make('div');list.className='entity-list-inline';cast.slice(0,12).forEach(p=>list.append(a(p.name,`./person?id=${encodeURIComponent(slug(p.name))}`)));c.append(list)}else c.append(make('p','Cast and crew information is not available yet.','muted'));body.append(c);body.append(providerSection(m));const b=sec('Box Office'),stats=bo.movies?.[String(id)];if(stats){[['India Net',stats.indiaNet],['India Gross',stats.indiaGross],['Overseas',stats.overseas],['Worldwide',stats.worldwide],['Verdict',stats.verdict]].forEach(([k,v])=>v&&b.append(make('p',`${k}: ${v}`,'meta')))}else b.append(make('p','Verified box-office figures will appear when editorial data is available.','muted'));body.append(b);const o=sec('OTT Release'),od=ott.movies?.[String(id)];if(od){if(od.platform)o.append(make('p',`Editorial OTT listing: ${od.platform}`,'meta'));if(od.releaseDate)o.append(make('p',`Release date: ${od.releaseDate}`,'meta'))}else o.append(make('p','Editorial OTT release data will appear after a verified release update.','muted'));body.append(o);const related=(Array.isArray(local)?local:[]).filter(x=>String(x.id)!==String(id)).slice(0,6);if(related.length){const r=sec('Related Movies'),list=make('div');list.className='entity-list-inline';related.forEach(x=>list.append(a(x.title,`./movie?id=${encodeURIComponent(x.id)}`)));r.append(list);body.append(r)}body.append(a('← Browse more movies','../pages/search','secondary-btn'));article.append(pw,body);root.replaceChildren(article);schema(m,dir,cast,genres)}async function init(){if(!id){root.replaceChildren(make('h1','Movie Details'),make('p','Choose a movie from Search to view its details.','muted'),a('Browse movies','../pages/search','secondary-btn'));return}let m=null;const local=await get('../data/movies.json',[]);m=(Array.isArray(local)?local:[]).find(x=>String(x.id)===String(id));if(m){const q=await get(`../api/tmdb?mode=search&query=${encodeURIComponent(m.title)}&page=1&language=en-US`,{results:[]}),match=(q.results||[])[0];if(match?.id)m=await get(`../api/tmdb?mode=movie&id=${encodeURIComponent(match.id)}&language=en-US&region=IN`,m);return render(m)}if(/^\d+$/.test(id)){m=await get(`../api/tmdb?mode=movie&id=${encodeURIComponent(id)}&language=en-US&region=IN`,null);if(m&&!m.success)return render(m)}root.replaceChildren(make('h1','Movie details unavailable'),make('p','We could not load this movie right now. Please try again shortly.','muted'),a('Browse movies','../pages/search','secondary-btn'))}document.addEventListener('DOMContentLoaded',init)})();
</script></body></html>
