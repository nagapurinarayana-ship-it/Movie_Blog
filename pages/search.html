<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search Movies, Actors & Entertainment — MovieBlog</title><meta name="description" content="Search MovieBlog for movies, actors, genres, ratings and release dates. Find movie details, cast and current entertainment discovery powered by TMDB."><meta name="robots" content="noindex,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/search"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/css/ui.css"><link rel="stylesheet" href="../assets/css/light-only.css"></head><body><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../">Home</a></div></header><main class="container section"><p class="eyebrow">DISCOVER</p><h1>Search movies & entertainment</h1><p class="hero-copy">Find a movie, actor, genre or title and open a useful MovieBlog detail page.</p><div class="search-wrap"><label class="sr-only" for="query">Search movies, actors or genres</label><input id="query" type="search" placeholder="Search movies, actors, genres…" autocomplete="off" enterkeyhint="search"></div><p id="status" class="meta" aria-live="polite">Loading current movies…</p><section id="results" class="movies" aria-live="polite"></section><div id="pager" style="display:flex;justify-content:center;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap"></div></main><script src="../assets/js/global-header.js" defer></script><script src="../assets/js/search.js" defer></script><script>
(async()=>{const input=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results'),pager=document.getElementById('pager');const params=new URLSearchParams(location.search);input.value=params.get('q')||'';const IMAGE='https://image.tmdb.org/t/p/w500';let local=[],page=1,totalPages=1,active=input.value.trim(),rid=0;const norm=m=>({...m,id:m.id||`${m.title||m.name||'movie'}-${m.year||''}`,title:m.title||m.name||'Untitled',poster:m.poster||(m.poster_path?IMAGE+m.poster_path:''),releaseDate:String(m.releaseDate||m.release_date||m.year||''),rating:Number(m.rating||m.vote_average||0),overview:m.overview||m.plot||m.description||'',cast:Array.isArray(m.cast)?m.cast:[],genres:Array.isArray(m.genres)?m.genres:[]});async function loadLocal(){try{const r=await fetch('../data/movies.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d))local=d.map(norm)}}catch(_){}}async function tmdb(q,p){const endpoint=q?`../api/tmdb?mode=search&query=${encodeURIComponent(q)}&page=${p}&language=en-US`:`../api/tmdb?mode=popular&page=${p}&language=en-US`;const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();return{results:Array.isArray(d.results)?d.results.map(norm):[],pages:Number(d.total_pages||1)}}function cleanIntent(q){return q.replace(/\bbox office(?: collection)?(?: day \d+)?\b/gi,' ').replace(/\bott(?: release(?: date)?)?\b/gi,' ').replace(/\bstreaming(?: release(?: date)?)?\b/gi,' ').replace(/\b(latest|today|news|update|updates)\b/gi,' ').replace(/\s+/g,' ').trim()||q}function localSearch(q){const x=cleanIntent(q).toLowerCase();return local.filter(m=>[m.title,m.overview,...m.cast,...m.genres].join(' ').toLowerCase().includes(x))}function renderEmpty(q){results.replaceChildren();const card=document.createElement('article');card.className='card';const body=document.createElement('div');body.className='card-body';const h=document.createElement('h2');h.className='title';h.textContent='No exact movie match';const p=document.createElement('p');p.className='overview';p.textContent=q?`We could not find an exact title for “${q}”. Try a shorter movie name or browse a live section below.`:'Choose a MovieBlog section to continue.';const links=document.createElement('div');links.style.cssText='display:flex;gap:10px;flex-wrap:wrap';[['OTT releases','./ott'],['Trending today','./trending'],['Latest news','./news'],['Box office','./box-office-live']].forEach(([label,href])=>{const a=document.createElement('a');a.className='secondary-btn';a.href=href;a.textContent=label;links.append(a)});body.append(h,p,links);card.append(body);results.append(card)}function render(rows){results.replaceChildren();rows.forEach(m=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='poster';img.loading='lazy';img.alt=`${m.title} poster`;img.src=m.poster||'../assets/placeholder.png';const body=document.createElement('div');body.className='card-body';const h=document.createElement('h2');h.className='title';h.textContent=m.title;const p=document.createElement('p');p.className='meta';p.textContent=`⭐ ${m.rating?Number(m.rating).toFixed(1):'—'} • ${m.releaseDate||'Release TBA'}`;const o=document.createElement('p');o.className='overview';o.textContent=m.overview||'Movie details available.';const a=document.createElement('a');a.className='secondary-btn';a.href=`./movie?id=${encodeURIComponent(m.id)}`;a.textContent='View details';body.append(h,p,o,a);card.append(img,body);results.append(card)})}function renderPager(){pager.replaceChildren();if(totalPages<=1)return;const mk=(label,target,disabled)=>{const b=document.createElement('button');b.className='icon-btn';b.textContent=label;b.disabled=disabled;b.onclick=()=>run(active,target);return b};pager.append(mk('← Previous',page-1,page<=1));const s=document.createElement('span');s.className='meta';s.textContent=`Page ${page} of ${Math.min(totalPages,500)}`;pager.append(s,mk('Next →',page+1,page>=totalPages))}async function run(q=active,p=1){const my=++rid;active=q.trim();page=Math.max(1,p);const u=new URL(location.href);active?u.searchParams.set('q',active):u.searchParams.delete('q');u.searchParams.set('page',page);history.replaceState({},'',u);status.textContent=active?`Searching for “${active}”…`:'Loading popular movies…';results.replaceChildren();pager.replaceChildren();try{const live=await tmdb(active?cleanIntent(active):active,page);if(my!==rid)return;totalPages=Math.max(1,live.pages);render(live.results);status.textContent=`${live.results.length} result${live.results.length===1?'':'s'}${totalPages>1?` • page ${page}`:''}`;renderPager();if(!live.results.length&&active){const f=localSearch(active);if(f.length){render(f.slice(0,60));status.textContent=`Showing ${Math.min(f.length,60)} local results.`}else{renderEmpty(active);status.textContent=`No exact movie match for “${active}”.`}}}catch(_){const f=active?localSearch(active):local.slice(0,60);render(f.slice(0,60));totalPages=1;status.textContent=f.length?`Showing ${Math.min(f.length,60)} fallback results.`:'Search is temporarily unavailable. Try a shorter title or use one of the sections below.';if(!f.length)renderEmpty(active)}}await loadLocal();run(active,Math.max(1,Number(params.get('page')||1)));let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>run(input.value,1),300)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);run(input.value,1)}})})();
</script></body></html>
