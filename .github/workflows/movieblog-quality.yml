name: MovieBlog Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Audit SEO routes
        run: node scripts/seo-audit.mjs

      - name: Audit monetization
        run: node scripts/monetization-audit.mjs
