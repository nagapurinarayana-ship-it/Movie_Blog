<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebrity Movies, News & Filmography — MovieBlog</title><meta name="description" content="Explore movie celebrity profiles, filmography, latest entertainment updates and public buzz on MovieBlog; individual profiles load from verified catalog data."><meta name="robots" content="noindex,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/person"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/css/ui.css"><link rel="stylesheet" href="../assets/css/light-only.css"></head><body><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../pages/search">Search</a></div></header><main class="container section" id="person" aria-live="polite"><p class="eyebrow">CELEBRITY</p><h1>Movie Celebrity</h1><p class="hero-copy">Explore movies, filmography and current entertainment updates.</p></main><footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer><script src="../assets/js/global-header.js" defer></script><script src="../assets/js/entities.js" defer></script><script>
(()=>{const root=document.getElementById('person');const id=new URLSearchParams(location.search).get('id')||'';const slug=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');async function load(){try{const [entities,movies]=await Promise.all([fetch('../data/entities.json',{cache:'no-store'}).then(r=>r.json()),fetch('../data/movies.json',{cache:'no-store'}).then(r=>r.json())]);const actors=Array.isArray(entities.actors)?entities.actors:[],person=actors.find(x=>String(x.id).toLowerCase()===id.toLowerCase()||slug(x.name)===id.toLowerCase());if(!person){root.replaceChildren(Object.assign(document.createElement('h1'),{textContent:'Celebrity not found'}),Object.assign(document.createElement('p'),{className:'muted',textContent:'Choose a celebrity from a movie page or search to explore their profile.'}));return}const filmography=(Array.isArray(movies)?movies:[]).filter(m=>Array.isArray(m.cast)&&m.cast.some(c=>String(c).toLowerCase()===String(person.name).toLowerCase()));const canonical=`${location.origin}${location.pathname}?id=${encodeURIComponent(person.id)}`,description=`${person.name} movies, filmography, latest entertainment news and public buzz on MovieBlog.`;document.title=`${person.name} — Movies, News & Buzz | MovieBlog`;document.querySelector('meta[name="description"]').content=description;document.querySelector('link[rel="canonical"]').href=canonical;root.replaceChildren();const label=document.createElement('p');label.className='eyebrow';label.textContent='ACTOR / CELEBRITY';const h=document.createElement('h1');h.textContent=person.name;const intro=document.createElement('p');intro.className='hero-copy';intro.textContent=`Movies, filmography and current entertainment updates about ${person.name}.`;const film=document.createElement('section');film.className='detail-section';const fh=document.createElement('h2');fh.textContent='Movies & Filmography';film.append(fh);if(filmography.length){const list=document.createElement('div');list.className='entity-list-inline';filmography.forEach(m=>{const a=document.createElement('a');a.className='entity-link';a.href=`./movie?id=${encodeURIComponent(m.id)}`;a.textContent=m.title;list.append(a)});film.append(list)}else{const p=document.createElement('p');p.className='muted';p.textContent='Filmography will expand as MovieBlog adds verified movie data.';film.append(p)}const buzz=document.createElement('section');buzz.className='detail-section';buzz.innerHTML='<h2>Latest buzz</h2><p class="muted">MovieBlog labels public discussion separately from confirmed news and does not present rumours as facts.</p>';root.append(label,h,intro,film,buzz);const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Person','@id':canonical+'#person',name:person.name,url:canonical});document.head.append(s)}catch(_){root.innerHTML='<h1>Celebrity profile unavailable</h1><p class="muted">Please try again shortly.</p>'}}load()})();
</script></body></html>
