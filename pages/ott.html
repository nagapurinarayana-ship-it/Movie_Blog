<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTT Releases — MovieBlog</title><meta name="description" content="MovieBlog OTT hub with current movie discovery data and clearly labeled streaming information when verified."><link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/ott.html"><link rel="stylesheet" href="../style.css"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"></head>
<body><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../pages/search">Search</a></div></header>
<main class="container section"><p class="eyebrow">STREAMING</p><h1>OTT &amp; Streaming Movies</h1><p class="hero-copy">Discover current and upcoming movies. Streaming-platform and OTT release dates are displayed only when verified data is available; TMDB discovery results below are labeled as such.</p><p id="status" class="meta">Loading upcoming movies…</p><section id="ott" class="movies" aria-live="polite"></section></main>
<footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer>
<script>
(async()=>{const root=document.getElementById('ott'),status=document.getElementById('status'),IMAGE_BASE='https://image.tmdb.org/t/p/w500';try{const r=await fetch('../api/tmdb?mode=upcoming&page=1&region=IN&language=en-US',{cache:'no-store'});const d=await r.json();const movies=Array.isArray(d.results)?d.results:[];root.replaceChildren();movies.slice(0,20).forEach(m=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='poster';img.loading='lazy';img.alt=`${m.title} poster`;img.src=m.poster_path?IMAGE_BASE+m.poster_path:'../assets/placeholder.png';const body=document.createElement('div');body.className='card-body';const h=document.createElement('h2');h.className='title';h.textContent=m.title;const p=document.createElement('p');p.className='meta';p.textContent=`Theatrical/Upcoming • ${m.release_date||'Release TBA'} • ⭐ ${m.vote_average||0}`;const o=document.createElement('p');o.className='overview';o.textContent=m.overview||'TMDB movie details available.';const a=document.createElement('a');a.className='secondary-btn';a.href=`./movie?id=${m.id}`;a.textContent='View movie';body.append(h,p,o,a);card.append(img,body);root.appendChild(card);});status.textContent=`${movies.length} upcoming movie results • TMDB data • OTT platform not implied`;}catch(_){status.textContent='Upcoming movie data could not be loaded.';root.innerHTML='<article class="feature-panel"><span class="panel-icon">📺</span><div><h2>Try again shortly</h2><p>TMDB is temporarily unavailable.</p></div></article>';}})();
</script></body></html>
