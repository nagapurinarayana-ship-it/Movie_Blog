<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieBlog Content Status</title><meta name="description" content="MovieBlog content inventory status."><link rel="canonical" href="https://nagapurinarayana-ship-it.github.io/Movie_Blog/pages/content-status.html"><link rel="stylesheet" href="../style.css"></head><body class="dark"><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../pages/content-plan-v8.html">Content Plan</a></div></header><main class="container section"><p class="eyebrow">INVENTORY STATUS</p><h1>Content inventory</h1><div id="status" class="intro-grid"></div><p class="muted">Zero counts are intentional until factual data is added from verified sources.</p></main><footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer><script>(async()=>{try{const d=await fetch('../data/seed-status.json',{cache:'no-store'}).then(r=>r.json());const root=document.getElementById('status');[['Movies',d.movieCount],['Actors',d.actorCount],['Directors',d.directorCount],['Articles',d.articleCount],['Box-office titles',d.boxOfficeMovieCount],['OTT titles',d.ottMovieCount]].forEach(([k,v])=>{const a=document.createElement('article');a.className='feature-panel';const b=document.createElement('div');const h=document.createElement('h2');h.textContent=String(v);const p=document.createElement('p');p.textContent=k;b.append(h,p);a.appendChild(b);root.appendChild(a)})}catch(_){document.getElementById('status').textContent='Status unavailable.'}})()</script></body></html>
