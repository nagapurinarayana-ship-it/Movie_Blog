<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieBlog Content Inventory</title><meta name="description" content="MovieBlog editorial inventory and publishing workflow."><link rel="canonical" href="https://nagapurinarayana-ship-it.github.io/Movie_Blog/pages/content-plan.html"><link rel="stylesheet" href="../style.css"></head><body class="dark"><header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../pages/trending.html">Trending</a></div></header><main class="container section"><p class="eyebrow">EDITORIAL INVENTORY</p><h1>Content clusters to populate</h1><p class="muted">This is a planning surface. It intentionally contains no unverified movie facts.</p><section id="clusters" class="news-list"></section></main><footer class="site-footer"><div class="container"><a href="../">← Back to MovieBlog</a></div></footer><script>(async()=>{const root=document.getElementById('clusters');try{const r=await fetch('../data/content-plan-v8.json',{cache:'no-store'});const d=await r.json();d.priorityClusters.forEach(c=>{const card=document.createElement('article');card.className='card news-card';const b=document.createElement('div');b.className='card-body';const h=document.createElement('h2');h.textContent=c.label;const p=document.createElement('p');p.textContent=c.goal;const ul=document.createElement('ul');ul.className='entity-list';c.fields.forEach(f=>{const li=document.createElement('li');li.textContent=f;ul.appendChild(li)});b.append(h,p,ul);card.appendChild(b);root.appendChild(card)})}catch(_){root.textContent='Inventory unavailable.'}})()</script></body></html>
