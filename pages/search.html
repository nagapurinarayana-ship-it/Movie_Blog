<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Search Movies — MovieBlog</title>
  <meta name="description" content="Search MovieBlog for current movie titles, ratings, release dates and details powered by TMDB.">
  <link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/search">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../">Home</a></div></header>
<main class="container section">
  <p class="eyebrow">DISCOVER</p>
  <h1>Search Movies</h1>
  <p class="hero-copy">Search the live MovieBlog catalog and TMDB movie database for titles, release dates, ratings and overviews.</p>
  <div class="search-wrap"><label class="sr-only" for="query">Search</label><input id="query" type="search" placeholder="Search movies, actors, genres…" autocomplete="off"></div>
  <p id="status" class="meta">Loading current movies…</p>
  <section id="results" class="movies" aria-live="polite"></section>
</main>
<script>
(async()=>{
  const input=document.getElementById('query'), status=document.getElementById('status'), results=document.getElementById('results');
  const params=new URLSearchParams(location.search); input.value=params.get('q')||'';
  const IMAGE_BASE='https://image.tmdb.org/t/p/w500'; let local=[];
  const normalize=m=>({...m,id:m.id||m.imdbID||`${m.title||m.name||'movie'}-${m.year||''}`,title:m.title||m.name||'Untitled',poster:m.poster||m.posterURL||(m.poster_path?IMAGE_BASE+m.poster_path:'')||m.imageUrl||'',releaseDate:String(m.releaseDate||m.release_date||m.year||''),rating:Number(m.rating||m.vote_average||m.imdbRating||0),overview:m.overview||m.plot||m.description||'',cast:Array.isArray(m.cast)?m.cast:(Array.isArray(m.actors)?m.actors:[]),genres:Array.isArray(m.genres)?m.genres:(Array.isArray(m.genre)?m.genre:[])});
  async function loadLocal(){try{const r=await fetch('../data/movies.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d))local=d.map(normalize);}}catch(_){} }
  async function tmdb(query){const endpoint=query?`../api/tmdb?mode=search&query=${encodeURIComponent(query)}&page=1&language=en-US`:'../api/tmdb?mode=popular&page=1&language=en-US';const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw new Error(`TMDB ${r.status}`);const d=await r.json();return Array.isArray(d.results)?d.results.map(normalize):[];}
  function merge(a,b){const out=[],seen=new Set();for(const m of [...a,...b]){const k=String(m.id||m.title).toLowerCase();if(!k||seen.has(k))continue;seen.add(k);out.push(m);}return out;}
  function render(matches){results.replaceChildren();matches.slice(0,60).forEach(m=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='poster';img.loading='lazy';img.alt=`${m.title} poster`;img.src=m.poster||'../assets/placeholder.png';const body=document.createElement('div');body.className='card-body';const h=document.createElement('h2');h.className='title';h.textContent=m.title;const p=document.createElement('p');p.className='meta';p.textContent=`⭐ ${m.rating||0} • ${m.releaseDate||'Release TBA'}`;const o=document.createElement('p');o.className='overview';o.textContent=m.overview||'TMDB details available.';const a=document.createElement('a');a.className='secondary-btn';a.href=`./movie?id=${encodeURIComponent(m.id)}`;a.textContent='View details';body.append(h,p,o,a);card.append(img,body);results.appendChild(card);});status.textContent=`${matches.length} result${matches.length===1?'':'s'}`;}
  async function run(){status.textContent='Loading current TMDB results…';try{await loadLocal();const q=input.value.trim();const live=await tmdb(q);const combined=merge(live,local);render(q?live:combined);}catch(_){const q=input.value.trim().toLowerCase();const fallback=q?local.filter(m=>[m.title,m.overview,...m.cast,...m.genres].join(' ').toLowerCase().includes(q)):local;render(fallback);}}
  let timer; input.addEventListener('input',()=>{const q=input.value.trim();const url=new URL(location.href);q?url.searchParams.set('q',q):url.searchParams.delete('q');history.replaceState({},'',url);clearTimeout(timer);timer=setTimeout(run,250);});
  run();
})();
</script>
</body>
</html>
