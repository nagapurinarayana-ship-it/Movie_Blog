<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Movie Details — MovieBlog</title>
  <meta name="description" content="Movie details, cast, crew, trailers, release information and streaming availability on MovieBlog.">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/movie">
  <meta property="og:type" content="video.movie">
  <meta property="og:site_name" content="MovieBlog">
  <meta property="og:title" content="Movie Details — MovieBlog">
  <meta property="og:description" content="Movie details, cast, crew, trailers, release information and streaming availability on MovieBlog.">
  <meta property="og:url" content="https://movie-blog-bdt.pages.dev/pages/movie">
  <meta property="og:image" content="https://movie-blog-bdt.pages.dev/assets/placeholder.png">
  <meta property="og:image:alt" content="Movie poster on MovieBlog">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Movie Details — MovieBlog">
  <meta name="twitter:description" content="Movie details, cast, crew, trailers, release information and streaming availability on MovieBlog.">
  <meta name="twitter:image" content="https://movie-blog-bdt.pages.dev/assets/placeholder.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a href="../" class="logo" aria-label="MovieBlog home">🎬 MovieBlog</a>
    <a class="icon-btn" href="../pages/search">Search</a>
  </div>
</header>

<main class="container section">
  <nav aria-label="Breadcrumb" class="meta" id="breadcrumbs">
    <a href="../">Home</a> <span aria-hidden="true">›</span> <a href="../pages/search">Movies</a> <span aria-hidden="true">›</span> <span>Details</span>
  </nav>
  <div id="movieDetails" aria-live="polite">Loading movie details…</div>
</main>

<footer class="site-footer">
  <div class="container"><a href="../">← Back to MovieBlog</a></div>
</footer>

<script src="../assets/js/entities.js" defer></script>
<script>
(() => {
  const root = document.getElementById('movieDetails');
  const id = new URLSearchParams(location.search).get('id');
  const DATA_BASE = '../data/';
  const IMAGE_BASE = 'https://image.tmdb.org/t/p/w780';
  const BACKDROP_BASE = 'https://image.tmdb.org/t/p/w1280';

  const el = (tag, value = '', className = '') => {
    const node = document.createElement(tag);
    if (value !== undefined && value !== null) node.textContent = value;
    if (className) node.className = className;
    return node;
  };

  const section = (title) => {
    const node = document.createElement('section');
    node.className = 'detail-section';
    node.appendChild(el('h2', title));
    return node;
  };

  const link = (label, href, className = 'entity-link') => {
    const a = document.createElement('a');
    a.href = href;
    a.textContent = label;
    a.className = className;
    return a;
  };

  async function json(url, fallback) {
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (_) {
      return fallback;
    }
  }

  async function getTmdbMovie(movieId) {
    const response = await fetch(`../api/tmdb?mode=movie&id=${encodeURIComponent(movieId)}&language=en-US&region=IN`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`TMDB returned ${response.status}`);
    return response.json();
  }

  function peopleFromCredits(movie) {
    const crew = Array.isArray(movie.credits?.crew) ? movie.credits.crew : [];
    const cast = Array.isArray(movie.credits?.cast) ? movie.credits.cast : [];
    const director = crew.find(person => person.job === 'Director');
    return { director, cast };
  }

  function genresText(movie) {
    return Array.isArray(movie.genres) ? movie.genres.map(g => g.name).filter(Boolean) : [];
  }

  function formatRuntime(minutes) {
    const value = Number(minutes || 0);
    if (!value) return 'Runtime TBA';
    const hours = Math.floor(value / 60);
    const mins = value % 60;
    return hours ? `${hours}h ${mins}m` : `${mins}m`;
  }

  function setMeta(movie) {
    const canonical = new URL(`./movie?id=${encodeURIComponent(movie.id)}`, location.href).href;
    const cleanOverview = String(movie.overview || '').replace(/\s+/g, ' ').trim();
    const description = (cleanOverview || `Find ${movie.title} movie details, cast, trailer, release information and streaming availability on MovieBlog.`).slice(0, 158);
    const title = `${movie.title} — MovieBlog`;
    document.title = title;
    document.querySelector('meta[name="description"]').content = description;
    document.querySelector('link[rel="canonical"]').href = canonical;
    document.querySelector('meta[property="og:url"]').content = canonical;
    document.querySelector('meta[property="og:title"]').content = title;
    document.querySelector('meta[property="og:description"]').content = description;
    document.querySelector('meta[name="twitter:title"]').content = title;
    document.querySelector('meta[name="twitter:description"]').content = description;
    const image = movie.backdrop_path ? BACKDROP_BASE + movie.backdrop_path : (movie.poster_path ? IMAGE_BASE + movie.poster_path : 'https://movie-blog-bdt.pages.dev/assets/placeholder.png');
    document.querySelector('meta[property="og:image"]').content = image;
    document.querySelector('meta[name="twitter:image"]').content = image;
    document.querySelector('meta[property="og:image:alt"]').content = `${movie.title} movie artwork`;

    const crumb = document.getElementById('breadcrumbs');
    crumb.replaceChildren(
      link('Home', '../'),
      el('span', ' › '),
      link('Movies', '../pages/search'),
      el('span', ' › '),
      el('span', movie.title || 'Movie details')
    );
  }

  function renderProviders(movie, body) {
    const country = movie['watch/providers']?.results?.IN;
    if (!country) return;
    const providers = [];
    for (const key of ['flatrate', 'free', 'ads', 'rent', 'buy']) {
      for (const provider of country[key] || []) {
        if (!providers.some(item => item.provider_id === provider.provider_id)) providers.push(provider);
      }
    }
    if (!providers.length && !country.link) return;
    const s = section('Where to Watch in India');
    s.appendChild(el('p', 'Streaming availability can change by region and over time.', 'muted'));
    if (providers.length) {
      const list = el('div', '', 'entity-list-inline');
      providers.slice(0, 12).forEach(provider => list.appendChild(el('span', provider.provider_name || 'Streaming service', 'meta')));
      s.appendChild(list);
    }
    if (country.link) s.appendChild(link('View current availability', country.link, 'secondary-btn'));
    body.appendChild(s);
  }

  function renderTrailer(movie, body) {
    const videos = Array.isArray(movie.videos?.results) ? movie.videos.results : [];
    const trailer = videos.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.official)
      || videos.find(v => v.site === 'YouTube' && v.type === 'Trailer')
      || videos.find(v => v.site === 'YouTube' && v.type === 'Teaser');
    if (!trailer?.key) return;
    const s = section('Official Trailer');
    const frame = document.createElement('iframe');
    frame.width = '100%'; frame.height = '420'; frame.loading = 'lazy'; frame.allowFullscreen = true;
    frame.title = `${movie.title || 'Movie'} trailer`;
    frame.src = `https://www.youtube.com/embed/${encodeURIComponent(trailer.key)}`;
    frame.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    s.appendChild(frame);
    body.appendChild(s);
  }

  function renderBoxOffice(movieId, body, data) {
    const record = data?.movies?.[String(movieId)];
    const s = section('Box Office');
    if (!record) s.appendChild(el('p', 'Box-office figures will appear here when verified editorial data is available.', 'muted'));
    else [['India Net', record.indiaNet], ['India Gross', record.indiaGross], ['Overseas', record.overseas], ['Worldwide', record.worldwide], ['Verdict', record.verdict]].forEach(([label, value]) => {
      if (value !== undefined && value !== null && value !== '') s.appendChild(el('p', `${label}: ${value}`, 'meta'));
    });
    body.appendChild(s);
  }

  function renderOtt(movieId, body, data) {
    const record = data?.movies?.[String(movieId)];
    const s = section('OTT Release');
    if (!record) s.appendChild(el('p', 'OTT availability will appear after verified release data is added.', 'muted'));
    else {
      if (record.platform) s.appendChild(el('p', `Platform: ${record.platform}`, 'meta'));
      if (record.releaseDate) s.appendChild(el('p', `Release date: ${record.releaseDate}`, 'meta'));
    }
    body.appendChild(s);
  }

  function addStructuredData(movie, director, cast, genres) {
    const canonical = new URL(`./movie?id=${encodeURIComponent(movie.id)}`, location.href).href;
    const schema = {
      '@context': 'https://schema.org',
      '@type': 'Movie',
      '@id': `${canonical}#movie`,
      url: canonical,
      name: movie.title,
      description: movie.overview || undefined,
      image: movie.poster_path ? IMAGE_BASE + movie.poster_path : undefined,
      dateCreated: movie.release_date || undefined,
      genre: genres,
      duration: movie.runtime ? `PT${Number(movie.runtime)}M` : undefined,
      countryOfOrigin: movie.production_countries?.map(c => ({ '@type': 'Country', name: c.name })) || undefined,
      aggregateRating: movie.vote_count ? {
        '@type': 'AggregateRating',
        ratingValue: Number(movie.vote_average || 0).toFixed(1),
        ratingCount: Number(movie.vote_count),
        bestRating: '10',
        worstRating: '0'
      } : undefined,
      director: director ? { '@type': 'Person', name: director.name } : undefined,
      actor: cast.slice(0, 10).map(person => ({ '@type': 'Person', name: person.name }))
    };
    const breadcrumb = {
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Home', item: new URL('../', location.href).href },
        { '@type': 'ListItem', position: 2, name: 'Movies', item: new URL('../pages/search', location.href).href },
        { '@type': 'ListItem', position: 3, name: movie.title, item: canonical }
      ]
    };
    [schema, breadcrumb].forEach(data => {
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);
    });
  }

  async function render() {
    if (!id || !/^\d+$/.test(id)) {
      root.replaceChildren(el('h1', 'Movie not found'), el('p', 'A valid movie id is required.', 'muted'), link('← Browse movies', '../pages/search', 'secondary-btn'));
      return;
    }
    root.textContent = 'Loading movie details…';
    try {
      const [movie, entities, boxOffice, ott] = await Promise.all([
        getTmdbMovie(id),
        window.MovieBlogEntities?.loadEntities?.() || Promise.resolve({ actors: [] }),
        json(`${DATA_BASE}box-office.json`, { movies: {} }),
        json(`${DATA_BASE}ott.json`, { movies: {} })
      ]);
      if (!movie || movie.success === false) throw new Error('Movie not found');
      setMeta(movie);
      const { director, cast } = peopleFromCredits(movie);
      const genres = genresText(movie);
      const article = document.createElement('article');
      article.className = 'card detail-card';
      const posterWrap = el('div', '', 'poster-wrap');
      const poster = document.createElement('img');
      poster.className = 'poster'; poster.loading = 'eager'; poster.alt = `${movie.title} poster`;
      poster.src = movie.poster_path ? IMAGE_BASE + movie.poster_path : '../assets/placeholder.png';
      poster.onerror = () => { poster.src = '../assets/placeholder.png'; };
      posterWrap.appendChild(poster);

      const body = el('div', '', 'card-body');
      body.appendChild(el('p', 'MOVIE', 'eyebrow'));
      body.appendChild(el('h1', movie.title || 'Untitled'));
      const metaParts = [];
      if (movie.release_date) metaParts.push(movie.release_date.slice(0, 4));
      metaParts.push(formatRuntime(movie.runtime));
      if (movie.vote_average) metaParts.push(`⭐ ${Number(movie.vote_average).toFixed(1)}`);
      if (movie.vote_count) metaParts.push(`${Number(movie.vote_count).toLocaleString()} votes`);
      body.appendChild(el('p', metaParts.join(' • '), 'meta'));
      if (genres.length) body.appendChild(el('p', genres.join(' • '), 'meta'));
      if (movie.tagline) body.appendChild(el('p', `“${movie.tagline}”`, 'eyebrow'));
      body.appendChild(el('p', movie.overview || 'Movie information is not available yet.', 'overview'));

      const credits = section('Cast & Crew');
      if (director) {
        const row = el('p', '', 'meta');
        row.appendChild(document.createTextNode('Director: '));
        row.appendChild(link(director.name, `director?id=${encodeURIComponent(window.MovieBlogEntities?.slugify?.(director.name) || director.id)}`));
        credits.appendChild(row);
      }
      if (cast.length) {
        const castList = el('div', '', 'entity-list-inline');
        cast.slice(0, 12).forEach(person => {
          const known = (entities.actors || []).find(a => String(a.name).toLowerCase() === String(person.name).toLowerCase());
          const slug = known?.id || window.MovieBlogEntities?.slugify?.(person.name) || person.id;
          castList.appendChild(link(person.name, `actor?id=${encodeURIComponent(slug)}`));
        });
        credits.appendChild(castList);
      }
      if (!director && !cast.length) credits.appendChild(el('p', 'Cast and crew information is not available.', 'muted'));
      body.appendChild(credits);
      renderTrailer(movie, body);
      renderProviders(movie, body);
      renderBoxOffice(movie.id, body, boxOffice);
      renderOtt(movie.id, body, ott);
      body.appendChild(link('← Browse more movies', '../pages/search', 'secondary-btn'));
      article.append(posterWrap, body);
      root.replaceChildren(article);
      addStructuredData(movie, director, cast, genres);
    } catch (error) {
      console.error(error);
      root.replaceChildren(
        el('h1', 'Movie details unavailable'),
        el('p', 'We could not load this movie from the live movie database. Please try again shortly.', 'muted'),
        link('← Browse movies', '../pages/search', 'secondary-btn')
      );
    }
  }

  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
