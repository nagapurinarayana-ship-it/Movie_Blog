<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search Movies — MovieBlog</title>
  <meta name="description" content="Search MovieBlog for movies, actors, genres, ratings and release dates powered by TMDB.">
  <link rel="canonical" href="https://movie-blog-bdt.pages.dev/pages/search.html">
  <link rel="stylesheet" href="../style.css">
<meta name="robots" content="noindex,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"></head>
<body>
<header class="nav"><div class="container nav-inner"><a href="../" class="logo">🎬 MovieBlog</a><a class="icon-btn" href="../">Home</a></div></header>
<main class="container section">
  <p class="eyebrow">DISCOVER</p>
  <h1>Search Movies</h1>
  <p class="hero-copy">Search movies, actors and genres across the live TMDB catalog.</p>
  <div class="search-wrap"><label class="sr-only" for="query">Search movies, actors or genres</label><input id="query" type="search" placeholder="Search movies, actors, genres…" autocomplete="off" enterkeyhint="search"></div>
  <p id="status" class="meta" aria-live="polite">Loading current movies…</p>
  <section id="results" class="movies" aria-live="polite"></section>
  <div id="pager" style="display:flex;justify-content:center;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap"></div>
</main>
<script>
(async()=>{
  const input=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results'),pager=document.getElementById('pager');
  const params=new URLSearchParams(location.search); input.value=params.get('q')||'';
  const IMAGE_BASE='https://image.tmdb.org/t/p/w500'; let local=[]; let page=1; let totalPages=1; let activeQuery=input.value.trim(); let requestId=0;
  const normalize=m=>({...m,id:m.id||m.imdbID||`${m.title||m.name||'movie'}-${m.year||''}`,title:m.title||m.name||'Untitled',poster:m.poster||m.posterURL||(m.poster_path?IMAGE_BASE+m.poster_path:'')||m.imageUrl||'',releaseDate:String(m.releaseDate||m.release_date||m.year||''),rating:Number(m.rating||m.vote_average||m.imdbRating||0),overview:m.overview||m.plot||m.description||'',cast:Array.isArray(m.cast)?m.cast:(Array.isArray(m.actors)?m.actors:[]),genres:Array.isArray(m.genres)?m.genres:(Array.isArray(m.genre)?m.genre:[])});
  async function loadLocal(){try{const r=await fetch('../data/movies.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d))local=d.map(normalize);}}catch(_){} }
  async function tmdb(query,p){const endpoint=query?`../api/tmdb?mode=search&query=${encodeURIComponent(query)}&page=${p}&language=en-US`:`../api/tmdb?mode=popular&page=${p}&language=en-US`;const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw new Error(`TMDB ${r.status}`);const d=await r.json();return {results:Array.isArray(d.results)?d.results.map(normalize):[],pages:Number(d.total_pages||1)};}
  function localSearch(q){const x=q.toLowerCase();return local.filter(m=>[m.title,m.overview,...m.cast,...m.genres].join(' ').toLowerCase().includes(x));}
  function render(matches){results.replaceChildren();matches.forEach(m=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='poster';img.loading='lazy';img.alt=`${m.title} poster`;img.src=m.poster||'../assets/placeholder.png';img.onerror=()=>{img.src='../assets/placeholder.png'};const body=document.createElement('div');body.className='card-body';const h=document.createElement('h2');h.className='title';h.textContent=m.title;const p=document.createElement('p');p.className='meta';p.textContent=`⭐ ${m.rating||0} • ${m.releaseDate||'Release TBA'}`;const o=document.createElement('p');o.className='overview';o.textContent=m.overview||'Movie information will be added soon.';const a=document.createElement('a');a.className='secondary-btn';a.href=`./movie?id=${encodeURIComponent(m.id)}`;a.textContent='View details';body.append(h,p,o,a);card.append(img,body);results.appendChild(card);});}
  function renderPager(){pager.replaceChildren();if(totalPages<=1)return;const make=(label,target,disabled)=>{const b=document.createElement('button');b.className='icon-btn';b.type='button';b.textContent=label;b.disabled=disabled;b.addEventListener('click',()=>run(activeQuery,target));return b};pager.append(make('← Previous',page,page<=1));const label=document.createElement('span');label.className='meta';label.textContent=`Page ${page} of ${Math.min(totalPages,500)}`;pager.append(label);pager.append(make('Next →',page+1,page>=totalPages));}
  async function run(query=activeQuery,targetPage=1){const myId=++requestId;activeQuery=query.trim();page=Math.max(1,targetPage);const url=new URL(location.href);if(activeQuery)url.searchParams.set('q',activeQuery);else url.searchParams.delete('q');url.searchParams.set('page',page);history.replaceState({},'',url);status.textContent=activeQuery?`Searching TMDB for “${activeQuery}”…`:'Loading popular movies…';results.replaceChildren();pager.replaceChildren();try{const live=await tmdb(activeQuery,page);if(myId!==requestId)return;totalPages=Math.max(1,live.pages);render(live.results);status.textContent=`${live.results.length} result${live.results.length===1?'':'s'}${totalPages>1?` • page ${page}`:''}`;renderPager();if(!live.results.length&&activeQuery){const fallback=localSearch(activeQuery);if(fallback.length){render(fallback.slice(0,60));status.textContent=`Showing ${Math.min(fallback.length,60)} local result${fallback.length===1?'':'s'} while live results are unavailable.`;}}}catch(_){if(myId!==requestId)return;const fallback=activeQuery?localSearch(activeQuery):local.slice(0,60);render(fallback.slice(0,60));totalPages=1;status.textContent=fallback.length?`Showing ${Math.min(fallback.length,60)} fallback result${fallback.length===1?'':'s'}.`:'Search is temporarily unavailable. Please try again.';}}
  await loadLocal();
  const initialPage=Math.max(1,Number(params.get('page')||1));
  run(activeQuery,initialPage);
  let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>run(input.value.trim(),1),300);});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);run(input.value.trim(),1);}});
})();
</script>
</body>
</html>
